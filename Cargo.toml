[package]
name = "ctxproof"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Context-rot, diff-hygiene, claim-verification, and MCP guardrail tool for AI coding agents"
license = "MIT"
readme = "README.md"
keywords = ["ai", "mcp", "cli", "tree-sitter", "verification"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
tree-sitter = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
